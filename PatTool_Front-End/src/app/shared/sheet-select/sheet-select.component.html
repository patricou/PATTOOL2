<select
  class="form-select pat-sheet-select-native"
  [class.form-select-sm]="size === 'sm'"
  [id]="selectId || null"
  [disabled]="disabled"
  [ngModel]="value"
  [ngModelOptions]="{standalone: true}"
  [compareWith]="compareValues"
  (ngModelChange)="commit($event)"
  (blur)="markTouched()">
  <option *ngFor="let opt of options; trackBy: trackOption" [ngValue]="opt.value">
    {{ opt.label || (opt.labelKey ? (opt.labelKey | translate:opt.labelParams) : opt.value) }}
  </option>
</select>
