<div
  class="now-ticker"
  role="marquee"
  [attr.aria-label]="ariaLabel || label"
  [style.--now-ticker-accent]="accent">
  <div class="now-ticker__label" aria-hidden="true">
    <i class="fa" [ngClass]="icon"></i>
    <span>{{ label }}</span>
  </div>
  <div class="now-ticker__rows">
    <div class="now-ticker__idle" *ngIf="!items.length">{{ idle }}</div>
    <div class="now-ticker__row" *ngIf="items.length">
      <div class="now-ticker__track" [style.animationDuration.s]="durationSec">
        <div class="now-ticker__loop-half">
          <ng-container *ngFor="let _ of repeats">
            <ng-container *ngTemplateOutlet="bits"></ng-container>
          </ng-container>
        </div>
        <div class="now-ticker__loop-half" aria-hidden="true">
          <ng-container *ngFor="let _ of repeats">
            <ng-container *ngTemplateOutlet="bits"></ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #bits>
  <span class="now-ticker__item" *ngFor="let item of items; trackBy: trackIndex">
    <span class="now-ticker__key" *ngIf="item.key">{{ item.key }}</span>
    <span class="now-ticker__val">{{ item.value }}</span>
  </span>
</ng-template>
